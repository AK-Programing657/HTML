    <link rel="stylesheet" href="style.css">
</head>
<body>
      <header class="header">
        <div class="logo">
            <img src="Abdullah Web Developer Portrait.png" alt="Logo" width="50" height="60">
        </div>
            <form action="search.html" method="get">
                <input type="search" name="q" placeholder="Search...">
                <button type="submit">Search</button>
            </form>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
            <a href="signup.html" class="active">Sign Up</a>
            <a href="login.html">Login</a>
                <a href="html.html">HTML</a>
                <a href="css.html">CSS</a>
                <a href="javascript.html">JS</a>
                <form action="logout" method="post">
                    <button type="submit">Log Out</button>
                </form>
            </nav>
    </header>  
    <main>
        <h1>Sign Up W3Schools</h1>
        <section>
            <form action="" method="post">
                <div>
                    <label for="first name">First NAME</label>
                    <input type="text" id="first name" name="first name" placeholder="First Name" required>
                    <div>
                    <label for="last name">Last Name</label>
                    <input type="text" id="last name" name="last name" placeholder="Last Name" required>
                    </div>
                </div>
                <div>
                    <label for="phone">Phone NO</label>
                    <input type="tel" id="phone" name="phone" placeholder="03xxxxxxxxx" required>
                </div>
                <div>
                    <label for="dob">Data Birth</label>
                <input type="date" id="dob" name="dob" placeholder="Data Birth" required>
                </div>
                <div>
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter Your Password" required>
                </div>
                <div>
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter Your Email" required>
                </div>
                <div>
                    <label for="full address">Full Address</label>
                    <textarea name="full address" id="full address" rows="4" placeholder="Enter Your Address" required></textarea> 
                </div>
                <div>
                    <label for="gender">Gender</label>
                <select name="gender" id="gender" required>
                    <option value="" disable selected>Selecte Gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                </select>
                </div>
                <div>
                    <form action="index.html" method="get">
                        <button type="submit">Sign Up</button>
                    </form>
                </div>
        </section>
    </main>
